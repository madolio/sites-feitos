<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      TEMPLATE: troque {{BUSINESS_NAME}}, {{TAGLINE}}, {{DESCRIPTION}} e
      {{DOMAIN}} abaixo (busca e substitui no arquivo inteiro) e mantenha
      em sincronia com src/config/site.ts.
    -->
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{DOMAIN}}/" />
    <title>{{BUSINESS_NAME}} — {{TAGLINE}}</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{BUSINESS_NAME}}" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="{{DOMAIN}}/" />
    <meta property="og:title" content="{{BUSINESS_NAME}} — {{TAGLINE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{DOMAIN}}/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{BUSINESS_NAME}} — {{TAGLINE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{DOMAIN}}/og-image.png" />

    <!-- Fontes: troque a família aqui e em src/index.css (@theme) se mudar a tipografia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "{{BUSINESS_NAME}}",
        "description": "{{DESCRIPTION}}",
        "url": "{{DOMAIN}}/",
        "image": "{{DOMAIN}}/og-image.png",
        "email": "{{EMAIL}}",
        "areaServed": "BR",
        "priceRange": "$$",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
